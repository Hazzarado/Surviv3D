<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surviv.io 3D - Tactical Operations</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background-color: #050505; color: #f0f0f0;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            overflow: hidden; user-select: none; cursor: crosshair;
        }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        
        #hud-top {
            position: absolute; top: 25px; left: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 5; pointer-events: none; display: none;
        }
        .hud-row { display: flex; gap: 15px; }
        .hud-card {
            background: rgba(15, 18, 22, 0.85); border-left: 4px solid #00ffcc;
            padding: 12px 20px; border-radius: 0 6px 6px 0;
            backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .hud-label { font-size: 11px; text-transform: uppercase; color: #8899a6; letter-spacing: 1px; font-weight: bold; }
        .hud-value { font-size: 22px; font-weight: 900; color: #ffffff; }

        #dash-container {
            width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-top: 5px;
        }
        #dash-bar { width: 100%; height: 100%; background: #00ffcc; transition: width 0.1s linear; }

        #weapon-hud {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(15, 18, 22, 0.9); border-right: 4px solid #ffaa00;
            padding: 15px 25px; border-radius: 6px 0 0 6px; text-align: right;
            backdrop-filter: blur(8px); z-index: 5; box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: none;
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.92); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
        }
        .overlay-screen h1 { color: #00ffcc; font-size: 58px; margin-bottom: 5px; letter-spacing: 4px; text-shadow: 0 0 30px rgba(0,255,204,0.6); font-weight: 900; }
        .overlay-screen h2 { color: #00ffcc; font-size: 32px; margin-bottom: 25px; letter-spacing: 2px; }
        
        .menu-btn {
            background: rgba(0, 255, 204, 0.1); border: 2px solid #00ffcc; color: #00ffcc;
            padding: 15px 45px; font-size: 20px; font-weight: 800; letter-spacing: 2px;
            margin: 10px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0,255,204,0.2); text-transform: uppercase;
        }
        .menu-btn:hover { background: #00ffcc; color: #050505; box-shadow: 0 0 35px rgba(0,255,204,0.8); transform: translateY(-2px) scale(1.05); }

        .upgrade-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
        .upgrade-card {
            background: rgba(25, 30, 40, 0.9); border: 1px solid #334455; border-top: 4px solid #00ffcc;
            padding: 25px; width: 280px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .upgrade-card:hover { border-top-color: #ffaa00; background: rgba(35, 45, 60, 0.95); transform: translateY(-8px); box-shadow: 0 20px 40px rgba(255,170,0,0.3); }
        .upgrade-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .upgrade-desc { font-size: 15px; color: #aabbcc; line-height: 1.5; font-weight: 500; }
        .upgrade-stacks { font-size: 13px; color: #ffaa00; margin-top: 12px; font-weight: 800; }

        .damage-text {
            position: absolute; pointer-events: none; font-weight: 900; font-size: 24px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            z-index: 10; animation: floatUp 0.8s ease-out forwards; opacity: 1; transform: translate(-50%, -50%);
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            20% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -250%) scale(1); opacity: 0; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="game-container">
    <div id="main-menu" class="overlay-screen">
        <h1>SURVIV.IO 3D</h1>
        <p style="color: #8899a6; margin-bottom: 40px; letter-spacing: 2px; font-size: 18px; font-weight:bold;">TACTICAL OPERATIONS (RELOADED)</p>
        <button class="menu-btn" onclick="startGame()">INICIAR MISSÃO</button>
    </div>

    <div id="pause-menu" class="overlay-screen" style="display: none;">
        <h2>MISSÃO PAUSADA</h2>
        <button class="menu-btn" onclick="resumeGame()">RETOMAR</button>
        <button class="menu-btn" style="border-color: #ff3366; color: #ff3366;" onclick="location.reload()">ABORTAR MISSÃO</button>
    </div>

    <div id="upgrade-screen" class="overlay-screen" style="display: none;">
        <h2 style="font-size: 40px;">⚡ SUPRIMENTO TÁTICO</h2>
        <p style="color:#aaa; margin-bottom:30px; font-size: 18px;">Selecione um aprimoramento de campo</p>
        <div class="upgrade-grid" id="upgrade-options"></div>
    </div>
</div>

<div id="hud-top">
    <div class="hud-row">
        <div class="hud-card">
            <div class="hud-label">Integridade do Agente</div>
            <div class="hud-value"><span id="hp">100</span>/<span id="maxHp">100</span> <span id="shieldContainer" style="color:#00ffcc; font-size:16px;"></span></div>
        </div>
        <div class="hud-card" style="border-left-color: #ff3366;">
            <div class="hud-label">Patente Militar</div>
            <div class="hud-value">Nv. <span id="level">1</span> (<span id="xp">0</span>/<span id="maxXp">3</span>)</div>
        </div>
        <div class="hud-card" style="border-left-color: #ffaa00;">
            <div class="hud-label">Eliminações</div>
            <div class="hud-value" id="kills">0</div>
        </div>
    </div>
    <div class="hud-row" style="width: 200px;">
        <div class="hud-card" style="width: 100%; border-left-color: #b026ff; padding: 8px 15px;">
            <div class="hud-label" style="font-size:10px;">Evasão / Dash (Espaço)</div>
            <div id="dash-container"><div id="dash-bar"></div></div>
        </div>
    </div>
</div>

<div id="weapon-hud">
    <div class="hud-label" id="weaponName" style="color: #ffaa00; font-size: 14px;">Pistola 9mm</div>
    <div class="hud-value" style="font-size: 32px;"><span id="ammo">15</span><span style="color:#555; font-size: 20px;">/</span><span id="maxAmmo" style="font-size: 20px; color:#888;">15</span></div>
    <div id="reloadMsg" style="color:#ff3366; font-size:14px; font-weight:bold; margin-top:5px; height: 16px;"></div>
</div>

<script>
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c10);
    scene.fog = new THREE.FogExp2(0x0a0c10, 0.015);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x1a2636, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x88bbff, 1.5);
    dirLight.position.set(40, 60, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const floorGeo = new THREE.PlaneGeometry(200, 200, 1, 1);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x181c20, roughness: 0.9, metalness: 0.1 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(200, 100, 0x00ffcc, 0x1a2636);
    gridHelper.position.y = 0.05;
    gridHelper.material.opacity = 0.1;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // Dicionário de Armas Modernas
    const weapons = {
        pistol: { name: 'Pistola 9mm', type: 'gun', damage: 15, fireRate: 280, ammo: 15, reloadTime: 1000, bulletSpeed: 1.2, spread: 0.02, color: 0x00ffcc, pellets: 1, pierce: 0, shake: 0.1 },
        smg: { name: 'Vector SMG', type: 'gun', damage: 9, fireRate: 90, ammo: 40, reloadTime: 1400, bulletSpeed: 1.3, spread: 0.08, color: 0xffaa00, pellets: 1, pierce: 0, shake: 0.1 },
        shotgun: { name: 'Escopeta Spas-12', type: 'gun', damage: 16, fireRate: 800, ammo: 8, reloadTime: 1800, bulletSpeed: 1.0, spread: 0.25, color: 0xff3366, pellets: 8, pierce: 0, shake: 0.4 },
        rifle: { name: 'HK416 Assault Rifle', type: 'gun', damage: 22, fireRate: 150, ammo: 30, reloadTime: 1600, bulletSpeed: 1.5, spread: 0.02, color: 0x3399ff, pellets: 1, pierce: 0, shake: 0.15 },
        sniper: { name: 'AWP Sniper', type: 'gun', damage: 85, fireRate: 1400, ammo: 5, reloadTime: 2200, bulletSpeed: 2.5, spread: 0.0, color: 0xffffff, pellets: 1, pierce: 3, shake: 0.6 },
        minigun: { name: 'XM214 Minigun', type: 'gun', damage: 11, fireRate: 50, ammo: 150, reloadTime: 3000, bulletSpeed: 1.4, spread: 0.15, color: 0xffcc00, pellets: 1, pierce: 0, shake: 0.2 },
        launcher: { name: 'M32 Lança-Granadas', type: 'gun', damage: 45, fireRate: 1000, ammo: 4, reloadTime: 2000, bulletSpeed: 0.7, spread: 0.05, color: 0xff4400, pellets: 1, pierce: 0, explosive: true, shake: 0.5 },
        katana: { name: 'Katana Tática', type: 'melee', damage: 60, fireRate: 400, ammo: 999, reloadTime: 0, range: 5.5, color: 0x00ffcc, arc: 180, knockback: 2.5, shake: 0.3 },
        axe: { name: 'Machado Tomahawk', type: 'melee', damage: 90, fireRate: 800, ammo: 999, reloadTime: 0, range: 4.5, color: 0xffaa00, arc: 360, knockback: 4.0, shake: 0.6 }
    };

    let playerGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.8, 16), new THREE.MeshStandardMaterial({ color: 0x223322, roughness: 0.5, metalness: 0.2 }));
    bodyMesh.position.y = 0.9; bodyMesh.castShadow = true; playerGroup.add(bodyMesh);
    const visorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.25, 0.6), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
    visorMesh.position.set(0, 1.4, 0.45); playerGroup.add(visorMesh);

    const gunGroup = new THREE.Group();
    const meleeGroup = new THREE.Group();
    gunGroup.position.set(0.6, 1.1, 0.2);
    meleeGroup.position.set(0.6, 1.1, 0.2);
    
    const muzzleLight = new THREE.PointLight(0xffddaa, 0, 8);
    muzzleLight.position.set(0, 0, 1.5);
    gunGroup.add(muzzleLight);

    playerGroup.add(gunGroup);
    playerGroup.add(meleeGroup);
    scene.add(playerGroup);

    let activeBarrel = null; // Para rotacionar o cano da minigun

    function buildWeaponModel(type) {
        while(gunGroup.children.length > 1) { gunGroup.remove(gunGroup.children[1]); }
        while(meleeGroup.children.length > 0) { meleeGroup.remove(meleeGroup.children[0]); }
        activeBarrel = null;

        let w = weapons[type];
        let matDark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.3 });
        let matAcc = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 });
        let matGlow = new THREE.MeshStandardMaterial({ color: w.color, emissive: w.color, emissiveIntensity: 0.4 });
        
        if(w.type === 'gun') {
            if(type === 'pistol') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.6), matDark);
                b.position.z = 0.3; gunGroup.add(b);
            } else if(type === 'smg') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), matDark);
                let mag = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.2), matDark);
                b.position.z = 0.4; mag.position.set(0, -0.2, 0.5); gunGroup.add(b, mag);
            } else if(type === 'shotgun') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1.2), matDark);
                let pump = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.4), matAcc);
                b.position.z = 0.6; pump.position.set(0, -0.15, 0.8); gunGroup.add(b, pump);
            } else if(type === 'rifle') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 1.4), matDark);
                let sight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.3), matAcc);
                b.position.z = 0.7; sight.position.set(0, 0.2, 0.4); gunGroup.add(b, sight);
            } else if(type === 'sniper') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 2.2), matDark);
                let scope = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6), matDark);
                scope.rotation.x = Math.PI/2; b.position.z = 1.1; scope.position.set(0, 0.25, 0.6); gunGroup.add(b, scope);
            } else if(type === 'launcher') {
                let b = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.2, 12), matDark);
                b.rotation.x = Math.PI/2; b.position.z = 0.6; gunGroup.add(b);
            } else if(type === 'minigun') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 0.8), matDark);
                let barrels = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.0, 8), matAcc);
                barrels.rotation.x = Math.PI/2;
                b.position.z = 0.4; barrels.position.set(0, 0, 1.3);
                gunGroup.add(b, barrels);
                activeBarrel = barrels;
            }
        } else {
            if(type === 'katana') {
                let handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4), matDark);
                let blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 1.6), matGlow);
                handle.rotation.x = Math.PI/2; blade.rotation.x = Math.PI/2;
                handle.position.z = 0.2; blade.position.z = 1.2; meleeGroup.add(handle, blade);
            } else if(type === 'axe') {
                let handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2), matDark);
                let blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.4), matGlow);
                handle.rotation.x = Math.PI/2; handle.position.z = 0.6; blade.position.z = 1.1; blade.position.x = 0.15;
                meleeGroup.add(handle, blade);
            }
        }
    }

    let player = {
        x: 0, z: 0, radius: 0.9, speed: 0.18, hp: 100, maxHp: 100, shield: 0, maxShield: 0,
        currentWeapon: 'pistol', lastGun: 'pistol', ammo: 15, maxAmmo: 15, isReloading: false,
        lastShot: 0, kills: 0, level: 1, xp: 0, maxXp: 4,
        damageMult: 1, speedMult: 1, pierceBonus: 0, dashCooldown: 0, maxDashCooldown: 80, isDashing: 0,
        extraPellets: 0, fireBullets: false, vampirism: 0 // Upgrades Clássicos Restaurados!
    };

    let keys = {};
    let mouse = { x: 0, y: 0, down: false };
    let raycaster = new THREE.Raycaster();
    let mousePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    let intersectionPoint = new THREE.Vector3();

    let bullets = [], enemies = [], obstacles = [], lootDrops = [], particles = [], enemyBullets = [], fireZones = [];
    let gameState = 'MENU';
    let cameraShake = 0;
    let meleeAnimProgress = 1;

    // TODOS os Upgrades Reunidos!
    const upgradesConfig = {
        multishot: { title: "Cano Duplo", desc: "+1 Projétil por Disparo", max: 3, stacks: 0, apply: () => player.extraPellets += 1 },
        fire: { title: "Munição Incendiária", desc: "Seus tiros incendeiam o solo", max: 1, stacks: 0, apply: () => player.fireBullets = true },
        vampire: { title: "Vampirismo", desc: "Recupera 5 HP por Abate", max: 3, stacks: 0, apply: () => player.vampirism += 5 },
        speed: { title: "Botas Táticas", desc: "+20% Velocidade", max: 3, stacks: 0, apply: () => player.speedMult += 0.20 },
        damage: { title: "Calibre Pesado", desc: "+30% de Dano", max: 4, stacks: 0, apply: () => player.damageMult += 0.30 },
        shield: { title: "Gerador de Escudo", desc: "+50pts de Escudo", max: 3, stacks: 0, apply: () => { player.maxShield += 50; player.shield = player.maxShield; } },
        pierce: { title: "Munição AP", desc: "Tiros perfuram +1 alvo", max: 2, stacks: 0, apply: () => player.pierceBonus += 1 },
        dashCd: { title: "Refluxo Motor", desc: "-25% Recarga do Dash", max: 2, stacks: 0, apply: () => player.maxDashCooldown = Math.floor(player.maxDashCooldown * 0.75) }
    };

    window.addEventListener('keydown', (e) => {
        let k = e.key.toLowerCase();
        keys[k] = true;
        if (k === '1') { if (weapons[player.currentWeapon].type === 'melee') switchWeapon(player.lastGun); }
        if (k === '3') {
            if (player.currentWeapon !== 'katana' && player.currentWeapon !== 'axe') {
                if (weapons[player.currentWeapon].type === 'gun') player.lastGun = player.currentWeapon;
                switchWeapon(player.lastGunMelee || 'katana'); 
            }
        }
        if (k === 'r') reloadWeapon();
        if (k === ' ' && player.dashCooldown <= 0 && gameState === 'PLAYING') {
            player.isDashing = 12; 
            player.dashCooldown = player.maxDashCooldown;
            spawnParticles(player.x, 1, player.z, 0x00ffcc, 15, 0.6);
        }
        if (e.key === 'Escape') {
            if (gameState === 'PLAYING') { gameState = 'PAUSED'; document.getElementById('pause-menu').style.display = 'flex'; }
            else if (gameState === 'PAUSED') resumeGame();
        }
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);
    window.addEventListener('keydown', function(e) { if(e.key === ' ' && e.target == document.body) e.preventDefault(); });

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud-top').style.display = 'flex';
        document.getElementById('weapon-hud').style.display = 'block';
        buildWeaponModel(player.currentWeapon); 
        gameState = 'PLAYING'; spawnEnvironment(); updateUI();
    }

    function resumeGame() { gameState = 'PLAYING'; document.getElementById('pause-menu').style.display = 'none'; }

    // BUG DE RECARGA CORRIGIDO DEFINITIVAMENTE
    function reloadWeapon() {
        let w = weapons[player.currentWeapon];
        if (w.type === 'melee' || player.isReloading || player.ammo >= w.ammo) return;
        player.isReloading = true;
        document.getElementById('reloadMsg').innerText = "RECARREGANDO...";
        
        let initialWep = player.currentWeapon; // Guarda o nome da arma como string
        setTimeout(() => {
            // Se a arma atual for diferente daquela que iniciou o reload, apenas cancela.
            if(player.currentWeapon !== initialWep) { player.isReloading = false; return; }
            
            player.ammo = w.ammo; 
            player.isReloading = false;
            document.getElementById('reloadMsg').innerText = ""; 
            updateUI();
        }, w.reloadTime);
    }

    function switchWeapon(key) {
        let w = weapons[key];
        player.currentWeapon = key;
        buildWeaponModel(key); 
        
        if (w.type === 'gun') {
            player.maxAmmo = w.ammo; player.ammo = w.ammo; // Para fluidez, assume arma cheia ao pegar
            gunGroup.visible = true; meleeGroup.visible = false;
        } else {
            player.lastGunMelee = key; 
            gunGroup.visible = false; meleeGroup.visible = true;
        }
        player.isReloading = false;
        document.getElementById('reloadMsg').innerText = "";
        document.getElementById('weaponName').innerText = w.name;
        document.getElementById('weaponName').style.color = "#" + w.color.toString(16).padStart(6, '0');
        updateUI();
    }

    function spawnEnvironment() {
        for (let i = 0; i < 15; i++) {
            let obsGeo = new THREE.BoxGeometry(3.0, 4.0, 3.0);
            let obsMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.6, roughness: 0.5 });
            let obsMesh = new THREE.Mesh(obsGeo, obsMat);
            obsMesh.position.set((Math.random() - 0.5) * 140, 2.0, (Math.random() - 0.5) * 140);
            if(Math.hypot(obsMesh.position.x, obsMesh.position.z) < 10) continue;
            obsMesh.castShadow = true; obsMesh.receiveShadow = true;
            scene.add(obsMesh); obstacles.push({ mesh: obsMesh, radius: 2.2 });
        }
    }

    function showDamageText(x, y, z, amount, color="#fff") {
        let pos = new THREE.Vector3(x, y, z); pos.project(camera);
        let tx = (pos.x * .5 + .5) * window.innerWidth; let ty = (pos.y * -.5 + .5) * window.innerHeight;
        let el = document.createElement('div');
        el.className = 'damage-text'; el.innerText = Math.round(amount);
        el.style.color = color; el.style.left = tx + 'px'; el.style.top = ty + 'px';
        document.body.appendChild(el);
        setTimeout(() => { el.remove(); }, 800);
    }

    function spawnEnemy() {
        if (gameState !== 'PLAYING') return;
        let angle = Math.random() * Math.PI * 2;
        let dist = 60;
        let ex = player.x + Math.cos(angle) * dist; let ez = player.z + Math.sin(angle) * dist;
        let roll = Math.random(); let type = 'grunt';
        
        if (player.level > 2 && roll < 0.2) type = 'shooter';
        else if (player.level > 3 && roll < 0.4) type = 'charger';
        else if (player.level > 4 && roll < 0.45) type = 'tank';

        let mesh, hp, speed, color;
        let scale = 1 + (player.level * 0.1);

        if (type === 'grunt') {
            mesh = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0x440000 }));
            hp = 30 * scale; speed = 0.08 + Math.random() * 0.03; color = 0xff2244;
        } else if (type === 'shooter') {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 1.2), new THREE.MeshStandardMaterial({ color: 0x2288ff, emissive: 0x001144 }));
            hp = 25 * scale; speed = 0.06; color = 0x2288ff;
        } else if (type === 'charger') {
            mesh = new THREE.Mesh(new THREE.SphereGeometry(1.0, 12, 12), new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0x441100 }));
            hp = 45 * scale; speed = 0.05; color = 0xff8800;
        } else if (type === 'tank') {
            mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 3.0, 12), new THREE.MeshStandardMaterial({ color: 0x8822ff, emissive: 0x220044 }));
            hp = 200 * scale; speed = 0.04; color = 0x8822ff;
        }
        
        mesh.position.set(ex, mesh.geometry.parameters.height/2 || 1.0, ez);
        mesh.castShadow = true; scene.add(mesh);
        enemies.push({ mesh, type, hp, maxHp: hp, speed, color, attackCd: 0 });
    }
    setInterval(() => { spawnEnemy(); spawnEnemy(); }, Math.max(800, 2000 - (player.level*100)));

    function addXp(amount) {
        player.xp += amount;
        if (player.xp >= player.maxXp) {
            player.xp = 0; player.level++; player.maxXp = Math.floor(player.maxXp * 1.6);
            triggerLevelUp();
        }
        updateUI();
    }

    function triggerLevelUp() {
        let available = Object.keys(upgradesConfig).filter(k => upgradesConfig[k].stacks < upgradesConfig[k].max);
        if (available.length === 0) { player.hp = player.maxHp; updateUI(); return; }

        gameState = 'UPGRADE';
        let optionsDiv = document.getElementById('upgrade-options'); optionsDiv.innerHTML = '';
        let shuffled = available.sort(() => 0.5 - Math.random()).slice(0, 3);
        
        shuffled.forEach(key => {
            let up = upgradesConfig[key];
            let card = document.createElement('div'); card.className = 'upgrade-card';
            card.innerHTML = `<div class="upgrade-title">${up.title}</div><div class="upgrade-desc">${up.desc}</div><div class="upgrade-stacks">Upgrade Nível ${up.stacks + 1}</div>`;
            card.onclick = () => { up.apply(); up.stacks++; document.getElementById('upgrade-screen').style.display = 'none'; gameState = 'PLAYING'; updateUI(); };
            optionsDiv.appendChild(card);
        });
        document.getElementById('upgrade-screen').style.display = 'flex';
    }

    function updateUI() {
        document.getElementById('hp').innerText = Math.ceil(Math.max(0, player.hp));
        document.getElementById('maxHp').innerText = player.maxHp;
        document.getElementById('shieldContainer').innerText = player.maxShield > 0 ? ` (+${Math.ceil(player.shield)} Escudo)` : '';
        
        let w = weapons[player.currentWeapon];
        if (w.type === 'melee') { document.getElementById('ammo').innerText = "∞"; document.getElementById('maxAmmo').innerText = ""; } 
        else { document.getElementById('ammo').innerText = player.ammo; document.getElementById('maxAmmo').innerText = w.ammo; }
        
        document.getElementById('level').innerText = player.level;
        document.getElementById('xp').innerText = player.xp;
        document.getElementById('maxXp').innerText = player.maxXp;
        document.getElementById('kills').innerText = player.kills;
    }

    function spawnParticles(x, y, z, color, count=10, speedMult=1.0) {
        for (let i = 0; i < count; i++) {
            let pMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: color }));
            pMesh.position.set(x, y, z); scene.add(pMesh);
            particles.push({ 
                mesh: pMesh, life: 30 + Math.random()*20,
                vx: (Math.random() - 0.5) * speedMult, vy: (Math.random()*0.5 + 0.2) * speedMult, vz: (Math.random() - 0.5) * speedMult 
            });
        }
    }

    function spawnExplosion(x, y, z, radius, damage, color=0xff4400) {
        spawnParticles(x, y, z, color, 30, 1.5);
        let blast = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 16), new THREE.MeshBasicMaterial({ color: color, transparent:true, opacity:0.6 }));
        blast.position.set(x, y, z); scene.add(blast);
        setTimeout(() => scene.remove(blast), 100);

        for (let en of enemies) {
            let dist = Math.hypot(en.mesh.position.x - x, en.mesh.position.z - z);
            if (dist < radius) {
                en.hp -= damage; showDamageText(en.mesh.position.x, 2, en.mesh.position.z, damage, "#ffaa00");
                applyKnockback(en, x, z, 3.0); 
            }
        }
        cameraShake = 0.8;
    }

    // LOOT SYSTEM BALANCEADO (Muito menor chance de arma cair, cura mais comum)
    function dropLoot(x, z) {
        if(Math.random() > 0.12) return; // APENAS 12% DE CHANCE DE DROP GLOBAL
        
        let isHeal = Math.random() < 0.6; // Se dropar algo, tem 60% de chance de ser cura
        let wType = 'heal';
        
        if (!isHeal) {
            let types = ['smg', 'shotgun', 'rifle', 'sniper', 'launcher', 'minigun', 'axe'];
            wType = types[Math.floor(Math.random() * types.length)];
        }
        
        let color = wType === 'heal' ? 0x00ffcc : weapons[wType].color;
        let lMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 }));
        lMesh.position.set(x, 0.5, z); scene.add(lMesh);
        lootDrops.push({ mesh: lMesh, type: wType, rotSpeed: Math.random()*0.05 + 0.02 });
    }

    function applyKnockback(enemy, sourceX, sourceZ, force) {
        let angle = Math.atan2(enemy.mesh.position.z - sourceZ, enemy.mesh.position.x - sourceX);
        enemy.mesh.position.x += Math.cos(angle) * force;
        enemy.mesh.position.z += Math.sin(angle) * force;
    }

    function handleShooting() {
        if (!mouse.down || gameState !== 'PLAYING' || player.isReloading) return;
        let now = Date.now(); let w = weapons[player.currentWeapon];

        if (now - player.lastShot > w.fireRate) {
            player.lastShot = now; cameraShake = w.shake;
            
            if (w.type === 'gun') muzzleLight.intensity = 2.5; 
            if (activeBarrel) activeBarrel.rotation.z += Math.PI/2; // Gira barril minigun

            if (w.type === 'melee') {
                meleeAnimProgress = 0; 
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    let dist = Math.hypot(player.x - en.mesh.position.x, player.z - en.mesh.position.z);
                    if (dist <= w.range) {
                        let angleToEnemy = Math.atan2(en.mesh.position.z - player.z, en.mesh.position.x - player.x);
                        let playerAimAngle = Math.atan2(intersectionPoint.z - player.z, intersectionPoint.x - player.x);
                        let angleDiff = Math.abs(angleToEnemy - playerAimAngle);
                        if (angleDiff > Math.PI) angleDiff = 2*Math.PI - angleDiff;
                        
                        if (w.arc === 360 || angleDiff <= Math.PI/2) {
                            let dmg = w.damage * player.damageMult;
                            en.hp -= dmg;
                            showDamageText(en.mesh.position.x, 2, en.mesh.position.z, dmg, "#ffffff");
                            spawnParticles(en.mesh.position.x, 1.2, en.mesh.position.z, w.color, 8, 1);
                            applyKnockback(en, player.x, player.z, w.knockback); 
                        }
                    }
                }
            } else {
                if (player.ammo <= 0) { reloadWeapon(); return; }
                player.ammo--; updateUI();

                let baseAngle = Math.atan2(intersectionPoint.z - player.z, intersectionPoint.x - player.x);
                let totalPellets = w.pellets + player.extraPellets; // UPGRADE: MULTISHOT APLICADO!

                for (let i = 0; i < totalPellets; i++) {
                    let spreadAngle = baseAngle + (Math.random() - 0.5) * w.spread;
                    let bColor = player.fireBullets ? 0xff4400 : w.color; // UPGRADE FIRE
                    let bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: bColor }));
                    bMesh.position.set(player.x + Math.cos(spreadAngle), 1.2, player.z + Math.sin(spreadAngle));
                    scene.add(bMesh);
                    
                    bullets.push({
                        mesh: bMesh, vx: Math.cos(spreadAngle) * w.bulletSpeed, vz: Math.sin(spreadAngle) * w.bulletSpeed,
                        dmg: w.damage * player.damageMult, life: 120, pierce: w.pierce + player.pierceBonus, explosive: w.explosive, hitTargets: new Set()
                    });
                }
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        if (muzzleLight.intensity > 0) muzzleLight.intensity -= 0.3; 

        if(player.dashCooldown > 0) {
            player.dashCooldown--;
            document.getElementById('dash-bar').style.width = ((player.maxDashCooldown - player.dashCooldown)/player.maxDashCooldown)*100 + "%";
            document.getElementById('dash-bar').style.background = "#ff3366";
        } else {
            document.getElementById('dash-bar').style.width = "100%";
            document.getElementById('dash-bar').style.background = "#00ffcc";
        }

        handleShooting();

        if (player.currentWeapon !== 'pistol' && weapons[player.currentWeapon].type === 'melee' && meleeAnimProgress < 1) {
            meleeAnimProgress += 0.15; meleeGroup.rotation.y = (meleeAnimProgress - 0.5) * Math.PI * 2; 
        } else { meleeGroup.rotation.y = 0; }

        let dx = 0, dz = 0;
        if (keys['w'] || keys['arrowup']) dz -= 1;
        if (keys['s'] || keys['arrowdown']) dz += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;
        if (dx !== 0 && dz !== 0) { dx *= 0.7071; dz *= 0.7071; } 

        let currentSpeed = player.speed * player.speedMult;
        if (player.isDashing > 0) { currentSpeed *= 3.5; player.isDashing--; }

        player.x += dx * currentSpeed; player.z += dz * currentSpeed;
        player.x = Math.max(-95, Math.min(95, player.x)); player.z = Math.max(-95, Math.min(95, player.z));

        playerGroup.position.set(player.x, 0, player.z);

        raycaster.setFromCamera(mouse, camera); raycaster.ray.intersectPlane(mousePlane, intersectionPoint);
        playerGroup.lookAt(intersectionPoint.x, playerGroup.position.y, intersectionPoint.z);

        let targetCamX = player.x + (Math.random() - 0.5) * cameraShake;
        let targetCamZ = player.z + 20 + (Math.random() - 0.5) * cameraShake;
        camera.position.x += (targetCamX - camera.position.x) * 0.1;
        camera.position.z += (targetCamZ - camera.position.z) * 0.1;
        camera.position.y = 22; camera.lookAt(player.x, 0, player.z - 4);
        if (cameraShake > 0) cameraShake *= 0.85;

        // FOGO NO CHÃO (UPGRADE FIRE)
        for (let i = fireZones.length - 1; i >= 0; i--) {
            let fz = fireZones[i]; fz.life--;
            for (let en of enemies) {
                if (Math.hypot(fz.mesh.position.x - en.mesh.position.x, fz.mesh.position.z - en.mesh.position.z) < 1.5) {
                    en.hp -= 0.5; // Dano Contínuo (DoT)
                }
            }
            if (fz.life <= 0) { scene.remove(fz.mesh); fireZones.splice(i, 1); }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.mesh.position.x += p.vx; p.mesh.position.y += p.vy; p.mesh.position.z += p.vz;
            p.vy -= 0.03; 
            if(p.mesh.position.y <= 0) { p.mesh.position.y = 0; p.vx *= 0.8; p.vz *= 0.8; p.vy = 0; } 
            p.life--; if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.mesh.position.x += b.vx; b.mesh.position.z += b.vz; b.life--;
            if(Math.random() > 0.5) spawnParticles(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, b.mesh.material.color.getHex(), 1, 0.1);

            let hitSomething = false;
            for (let obs of obstacles) {
                if (Math.hypot(b.mesh.position.x - obs.mesh.position.x, b.mesh.position.z - obs.mesh.position.z) < obs.radius) { hitSomething = true; break; }
            }

            if (!hitSomething) {
                for (let en of enemies) {
                    if (b.hitTargets.has(en)) continue; 
                    let hitbox = (en.type === 'tank') ? 2.0 : 1.3;
                    if (Math.hypot(b.mesh.position.x - en.mesh.position.x, b.mesh.position.z - en.mesh.position.z) < hitbox) {
                        en.hp -= b.dmg; showDamageText(en.mesh.position.x, 2, en.mesh.position.z, b.dmg, "#ffffff");
                        spawnParticles(en.mesh.position.x, 1.2, en.mesh.position.z, en.color, 5, 0.5);
                        b.hitTargets.add(en);
                        
                        if (b.explosive) { spawnExplosion(b.mesh.position.x, 1.2, b.mesh.position.z, 4.0, b.dmg * 1.5, 0xff4400); hitSomething = true; } 
                        else if (b.pierce > 0) { b.pierce--; } 
                        else { hitSomething = true; }
                        break;
                    }
                }
            }

            if (hitSomething || b.life <= 0 || Math.abs(b.mesh.position.x) > 100 || Math.abs(b.mesh.position.z) > 100) {
                if(b.explosive && b.life > 0) spawnExplosion(b.mesh.position.x, 1.2, b.mesh.position.z, 4.0, b.dmg * 1.5, 0xff4400);
                
                // CRIA FOGO AO ACERTAR ALGO SE TIVER O UPGRADE
                if (player.fireBullets) {
                    let fMesh = new THREE.Mesh(new THREE.RingGeometry(0.5, 1.5, 12), new THREE.MeshBasicMaterial({ color: 0xff4400, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
                    fMesh.rotation.x = -Math.PI / 2; fMesh.position.set(b.mesh.position.x, 0.05, b.mesh.position.z);
                    scene.add(fMesh);
                    fireZones.push({ mesh: fMesh, life: 120 });
                }

                scene.remove(b.mesh); bullets.splice(i, 1);
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            eb.mesh.position.x += eb.vx; eb.mesh.position.z += eb.vz; eb.life--;
            spawnParticles(eb.mesh.position.x, 1.2, eb.mesh.position.z, 0x2288ff, 1, 0.1); 

            let hitObs = obstacles.some(obs => Math.hypot(eb.mesh.position.x - obs.mesh.position.x, eb.mesh.position.z - obs.mesh.position.z) < obs.radius);
            if (!hitObs && Math.hypot(eb.mesh.position.x - player.x, eb.mesh.position.z - player.z) < player.radius + 0.3) {
                takeDamage(20); hitObs = true;
            }
            if (hitObs || eb.life <= 0) { scene.remove(eb.mesh); enemyBullets.splice(i, 1); }
        }

        for (let i = lootDrops.length - 1; i >= 0; i--) {
            let l = lootDrops[i];
            l.mesh.rotation.y += l.rotSpeed; l.mesh.rotation.x += l.rotSpeed;
            if (Math.hypot(player.x - l.mesh.position.x, player.z - l.mesh.position.z) < 1.8) {
                if (l.type === 'heal') { player.hp = Math.min(player.maxHp, player.hp + 30); showDamageText(player.x, 2, player.z, "+30", "#00ffcc"); }
                else { switchWeapon(l.type); showDamageText(player.x, 2, player.z, "ARMA EQUIPADA", "#ffaa00"); }
                scene.remove(l.mesh); lootDrops.splice(i, 1); updateUI();
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            let distToPlayer = Math.hypot(player.x - en.mesh.position.x, player.z - en.mesh.position.z);
            let angle = Math.atan2(player.z - en.mesh.position.z, player.x - en.mesh.position.x);

            if (en.type === 'shooter' && distToPlayer < 25 && distToPlayer > 10) {
                en.mesh.lookAt(player.x, en.mesh.position.y, player.z);
                if (en.attackCd <= 0) {
                    let ebMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: 0x2288ff }));
                    ebMesh.position.set(en.mesh.position.x, 1.2, en.mesh.position.z);
                    scene.add(ebMesh);
                    enemyBullets.push({ mesh: ebMesh, vx: Math.cos(angle)*0.4, vz: Math.sin(angle)*0.4, life: 100 });
                    en.attackCd = 120; 
                }
            } else if (en.type === 'charger' && distToPlayer < 12 && en.attackCd <= 0) {
                en.speed = 0.4; en.attackCd = 200; 
            } else {
                en.mesh.position.x += Math.cos(angle) * en.speed;
                en.mesh.position.z += Math.sin(angle) * en.speed;
                en.mesh.lookAt(player.x, en.mesh.position.y, player.z);
                if (en.type === 'charger' && en.attackCd > 150) { en.speed *= 0.9; } 
                else if (en.type === 'charger') { en.speed = 0.05; }
            }

            if (en.attackCd > 0) en.attackCd--;

            if (distToPlayer < (en.type==='tank' ? 2.5 : 1.5)) {
                if(en.attackCd <= 0) {
                    let dmg = en.type === 'tank' ? 25 : (en.type === 'charger' && en.speed > 0.1 ? 20 : 12);
                    takeDamage(dmg); applyKnockback(en, player.x, player.z, 2.0); en.attackCd = 60; 
                }
            }

            if (en.hp <= 0) {
                spawnParticles(en.mesh.position.x, 1.2, en.mesh.position.z, en.color, 15, 1.2);
                dropLoot(en.mesh.position.x, en.mesh.position.z);
                scene.remove(en.mesh); enemies.splice(i, 1);
                player.kills++;
                addXp(en.type === 'tank' ? 5 : (en.type==='charger' ? 2 : 1));
                
                // UPGRADE: VAMPIRISMO APLICADO AQUI!
                if(player.vampirism > 0) {
                    player.hp = Math.min(player.maxHp, player.hp + player.vampirism);
                    showDamageText(player.x, 2, player.z, `+${player.vampirism}`, "#00ffcc");
                    updateUI();
                }
            } else {
                let colorRatio = en.hp / en.maxHp;
                if(en.type==='grunt') en.mesh.material.color.setRGB(1, colorRatio, colorRatio);
            }
        }
    }

    function takeDamage(amount) {
        if (player.isDashing > 0) return; 
        if (player.shield > 0) {
            player.shield -= amount;
            if (player.shield < 0) { player.hp += player.shield; player.shield = 0; }
        } else { player.hp -= amount; }
        cameraShake = 0.5;
        document.getElementById('game-container').style.boxShadow = "inset 0 0 100px rgba(255,0,0,0.5)";
        setTimeout(() => document.getElementById('game-container').style.boxShadow = "none", 100);
        updateUI();
        
        if (player.hp <= 0) {
            alert(`SISTEMA CRÍTICO! Agente Abatido.\nNível alcançado: ${player.level}\nEliminações: ${player.kills}`);
            location.reload();
        }
    }

    function animate() { requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
</script>
</body>
</html>
